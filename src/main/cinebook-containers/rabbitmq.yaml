version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cinebook_rabbitmq
    ports:
      - "5672:5672"   # Port for Spring Boot to connect (AMQP)
      - "15672:15672" # Port for Web UI (for debugging)
    environment:
      RABBITMQ_DEFAULT_USER: cinebook
      RABBITMQ_DEFAULT_PASS: Mile123_A
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
    driver: local